services:
  9router-ts:
    image: tailscale/tailscale:latest
    restart: always
    hostname: 9router-ts
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=9router
      - TS_STATE_DIR=/var/lib/tailscale
      # Userspace mode: keeps Tailscale's CGNAT netstack out of the host kernel,
      # so it stops fighting Cloudflare WARP (which tunnels 100.64.0.0/12) for
      # the ip rules / nftables that gate intranet access (VDI 100.76.234.0/26).
      - TS_USERSPACE=true
    volumes:
      - 9router-ts-state:/var/lib/tailscale

  9router:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: always
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    volumes:
      - 9router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://host.docker.internal:8788
      SEARXNG_URL: http://127.0.0.1:8080/search
      # Cap time-to-headers from upstreams: a hanging/dead backend then costs
      # ~69s worst case (4 attempts x 15s + retry delays) instead of ~249s at
      # the 60s default, so in-request combo failover is near-instant.
      FETCH_CONNECT_TIMEOUT_MS: "15000"
      STREAM_STALL_TIMEOUT_MS: "120000"
      QDRANT_URL: http://127.0.0.1:6333
    depends_on:
      9router-ts:
        condition: service_started
      ericaiproxy:
        condition: service_started

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom
    restart: always
    pull_policy: always
    command:
      - --host=0.0.0.0
      - --port=8788
      - --no-ccr
    volumes:
      - headroom-data:/home/nonroot/.headroom
    environment:
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_COMPRESS_ALLOW_REMOTE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/readyz', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    network_mode: host

  ericaiproxy:
    build:
      context: ${ERICAI_PROXY_DIR:-../ericai-client}
      network: host
      dockerfile_inline: |
        FROM python:3.13-slim
        WORKDIR /app
        COPY . /app
        RUN pip install --no-cache-dir -e ".[proxy]" && \
            python -c "from ericai.cert_trust import create_combined_ca_bundle; create_combined_ca_bundle()"
        EXPOSE 7999
        ENTRYPOINT ["python", "-c", "from ericai.ericai_proxy import start_proxy, ProxyArgs; start_proxy(ProxyArgs(host='0.0.0.0', port=7999))"]
    restart: always
    network_mode: host
    volumes:
      - ${HOME}/.IdentityService:/root/.IdentityService
      - ${HOME}/.ericai_authrecord:/app/.ericai_authrecord

  # Self-hosted Laya decision engine — the local classifier that backs the
  # "laya" combo strategy, speaking TypeSafe Jev's /v1/systemone wire protocol.
  # The 9router service reaches it over the host network at 127.0.0.1:8010.
  # If this container is down, the classifier path fails open (combo keeps its
  # configured order), so 9router boot never depends on it.
  laya:
    build:
      context: .
      network: host
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV HF_HOME=/root/.cache/huggingface
        # CPU torch first: laya's `torch>=2.0.0` has no CPU pin and would
        # otherwise pull the multi-GB CUDA wheel. The +cpu build from PyTorch's
        # CPU index satisfies the requirement so the next line doesn't.
        RUN pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0 \
            && pip install --no-cache-dir "laya[serve]"
        ENTRYPOINT ["laya-serve"]
    restart: always
    network_mode: host
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8010"
      LAYA_DEVICE: "cpu"
      LAYA_PRELOAD: "1"
      HF_HOME: /root/.cache/huggingface
    volumes:
      # The English checkpoint (~2.3GB) is downloaded on first boot and lives
      # here so container rebuilds don't re-fetch it.
      - laya-hf-cache:/root/.cache/huggingface

networks:
  default:
    driver: none

volumes:
  9router-data:
    external: true
  9router-ts-state:
    external: true
  headroom-data:
    name: headroom-data
  # Laya's HuggingFace checkpoint cache (created by Docker, not external —
  # 9router-data/-ts-state are pre-created on the host for the existing stack).
  laya-hf-cache:
